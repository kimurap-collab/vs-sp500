<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fable vs S&P500</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --green: #3ddc84;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .wrap { max-width: 1600px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.3rem; margin: 0 0 4px; }
  header .updated { color: var(--muted); font-size: 0.8rem; }

  .diff-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .diff-card .label { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
  .diff-card .amount { font-size: 2.6rem; font-weight: 700; line-height: 1.1; }
  .diff-card .pct { font-size: 1.1rem; margin-top: 6px; }
  .win { color: var(--green); }
  .lose { color: var(--red); }

  .nav-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .nav-box {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .nav-box .label { color: var(--muted); font-size: 0.8rem; }
  .nav-box .value { font-size: 1.2rem; font-weight: 600; margin-top: 4px; }

  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  section h2 { font-size: 0.95rem; margin: 0 0 12px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .num { text-align: right; }

  canvas { max-width: 100%; }
  .empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 12px 0; }
  .table-scroll { overflow-x: auto; }
  .sub { color: var(--muted); font-size: 0.75rem; display: block; }
  a.ticker-link { color: var(--text); text-decoration: none; font-weight: 600; }
  a.ticker-link:hover { text-decoration: underline; }
  .note { color: var(--muted); font-size: 0.72rem; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fable vs S&P500</h1>
    <div class="updated" id="updated">読み込み中...</div>
  </header>

  <div class="diff-card">
    <div class="label">対S&P500</div>
    <div class="amount" id="diff-amount">-</div>
    <div class="pct" id="diff-pct">-</div>
  </div>

  <div class="nav-row">
    <div class="nav-box">
      <div class="label">自分の評価額</div>
      <div class="value" id="nav-jpy">-</div>
    </div>
    <div class="nav-box">
      <div class="label">S&P500ベンチマーク</div>
      <div class="value" id="bench-jpy">-</div>
    </div>
  </div>

  <section>
    <h2>資産推移</h2>
    <canvas id="historyChart" height="180"></canvas>
  </section>

  <section>
    <h2>月次勝敗</h2>
    <table id="monthlyTable">
      <thead><tr><th>月</th><th class="num">評価額</th><th class="num">ベンチマーク</th><th>結果</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="monthlyEmpty" style="display:none;">まだデータがありません</div>
  </section>

  <section>
    <h2>保有一覧</h2>
    <div class="table-scroll">
    <table id="holdingsTable">
      <thead><tr>
        <th>銘柄</th><th class="num">株数</th><th class="num">取得単価</th>
        <th class="num">現在値(前日終値)</th><th class="num">損益率</th><th class="num">評価額</th><th class="num">ウェイト</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    </div>
    <div class="empty" id="holdingsEmpty" style="display:none;">保有なし（全額現金）</div>
    <div class="note">※目標は12ヶ月の目安。売買は投資憲章のルール（配分・トレンド）で判断</div>
  </section>

  <section>
    <h2>取引記録</h2>
    <table id="tradesTable">
      <thead><tr><th>日付</th><th>種別</th><th>銘柄</th><th class="num">金額</th><th>ルール</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="tradesEmpty" style="display:none;">取引履歴なし</div>
  </section>
</div>

<script>
function fmtPrice(value, currency) {
  if (value === null || value === undefined) return "-";
  const digits = currency === "USD" ? 2 : 1;
  const symbol = currency === "USD" ? "$" : "¥";
  return symbol + Number(value).toFixed(digits);
}

async function load() {
  const res = await fetch("data.json?t=" + Date.now());
  const data = await res.json();

  document.getElementById("updated").textContent = "最終更新: " + data.updated_at;

  const diffJpy = data.diff_jpy;
  const win = diffJpy >= 0;
  const sign = win ? "+" : "";
  const amountEl = document.getElementById("diff-amount");
  amountEl.textContent = sign + diffJpy.toLocaleString() + "円";
  amountEl.className = "amount " + (win ? "win" : "lose");
  const pctEl = document.getElementById("diff-pct");
  pctEl.textContent = sign + data.diff_pct.toFixed(2) + "%";
  pctEl.className = "pct " + (win ? "win" : "lose");

  document.getElementById("nav-jpy").textContent = "¥" + data.nav_jpy.toLocaleString();
  document.getElementById("bench-jpy").textContent = "¥" + data.bench_jpy.toLocaleString();

  // 資産推移グラフ
  const hist = data.history || [];
  new Chart(document.getElementById("historyChart"), {
    type: "line",
    data: {
      labels: hist.map(h => h.date),
      datasets: [
        {
          label: "自分",
          data: hist.map(h => h.nav),
          borderColor: "#3ddc84",
          backgroundColor: "transparent",
          tension: 0.15,
          pointRadius: 0,
        },
        {
          label: "S&P500",
          data: hist.map(h => h.bench),
          borderColor: "#8b93a3",
          backgroundColor: "transparent",
          tension: 0.15,
          pointRadius: 0,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: "#e6e8ec" } } },
      scales: {
        x: { ticks: { color: "#8b93a3", maxTicksLimit: 6 }, grid: { color: "#262b36" } },
        y: { ticks: { color: "#8b93a3" }, grid: { color: "#262b36" } },
      },
    },
  });

  // 月次勝敗
  const monthlyBody = document.querySelector("#monthlyTable tbody");
  const monthly = (data.monthly || []).slice().reverse();
  if (monthly.length === 0) {
    document.getElementById("monthlyEmpty").style.display = "block";
  } else {
    monthly.forEach(m => {
      const tr = document.createElement("tr");
      const resultJp = m.result === "win" ? "勝ち" : "負け";
      const cls = m.result === "win" ? "win" : "lose";
      tr.innerHTML = `<td>${m.month}</td><td class="num">¥${m.nav.toLocaleString()}</td>` +
        `<td class="num">¥${m.bench.toLocaleString()}</td><td class="${cls}">${resultJp}</td>`;
      monthlyBody.appendChild(tr);
    });
  }

  // 保有一覧
  const holdingsBody = document.querySelector("#holdingsTable tbody");
  const holdings = data.holdings || [];
  if (holdings.length === 0) {
    document.getElementById("holdingsEmpty").style.display = "block";
  } else {
    holdings.forEach(h => {
      const tr = document.createElement("tr");
      const priceStr = fmtPrice(h.price, h.currency);
      const avgCostStr = fmtPrice(h.avg_cost, h.currency);
      const reason = h.reason || "";
      const target = h.target || "";
      let pnlStr = "-", pnlCls = "";
      if (h.avg_cost > 0 && h.price != null) {
        const pnl = (h.price / h.avg_cost - 1) * 100;
        pnlStr = (pnl >= 0 ? "+" : "") + pnl.toFixed(2) + "%";
        pnlCls = pnl >= 0 ? "win" : "lose";
      }
      tr.innerHTML =
        `<td><a class="ticker-link" href="${h.link}" target="_blank" rel="noopener">${h.ticker}</a>` +
        `<span class="sub">${h.name}</span>` +
        `<span class="sub">理由: ${reason}　目標: ${target}</span></td>` +
        `<td class="num">${h.shares}</td>` +
        `<td class="num">${avgCostStr}</td>` +
        `<td class="num">${priceStr}</td>` +
        `<td class="num ${pnlCls}">${pnlStr}</td>` +
        `<td class="num">¥${h.value_jpy.toLocaleString()}</td>` +
        `<td class="num">${h.weight_pct}%</td>`;
      holdingsBody.appendChild(tr);
    });
  }

  // 取引記録（新しい順。report.pyが既に新しい順で渡す）
  const tradesBody = document.querySelector("#tradesTable tbody");
  const trades = data.trades || [];
  if (trades.length === 0) {
    document.getElementById("tradesEmpty").style.display = "block";
  } else {
    trades.forEach(t => {
      const tr = document.createElement("tr");
      const amt = Number(t.amount_jpy || 0).toLocaleString();
      tr.innerHTML = `<td>${t.date}</td><td>${t.action}</td><td>${t.ticker}</td>` +
        `<td class="num">¥${amt}</td><td>${t.rule}</td>`;
      tradesBody.appendChild(tr);
    });
  }
}

load().catch(err => {
  document.getElementById("updated").textContent = "データ読み込みエラー: " + err;
});
</script>
</body>
</html>
